<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Egg Arena</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#081627;font-family:system-ui,sans-serif}.game{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:18px 18px auto;display:flex;justify-content:space-between;pointer-events:none;color:white;font-weight:800;text-shadow:0 2px 8px #000}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));padding:28px;border:2px solid rgba(255,255,255,.18);border-radius:24px;background:rgba(8,22,39,.94);text-align:center;color:white;box-shadow:0 18px 60px rgba(0,0,0,.45)}.panel h1{margin:0 0 8px;font-size:42px}.panel p{opacity:.8}.panel button{border:0;border-radius:14px;padding:14px 24px;background:#ffb703;color:#1a1a1a;font-weight:900;font-size:18px;cursor:pointer}.hidden{display:none}.controls{margin-top:14px;font-size:13px;opacity:.65}.mobile-controls{position:absolute;inset:auto 14px 14px;display:none;justify-content:space-between;pointer-events:none}.pad{width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);pointer-events:auto}.shoot{width:92px;height:92px;border-radius:50%;margin:20px 8px 20px 0;background:rgba(255,183,3,.55);border:2px solid rgba(255,255,255,.25);pointer-events:auto}@media(pointer:coarse){.mobile-controls{display:flex}}
  </style>
</head>
<body>
  <main class="game">
    <canvas id="canvas" aria-label="Egg Arena game"></canvas>
    <div class="hud"><div>SCORE <span id="score">0</span></div><div>BEST <span id="best">0</span></div></div>
    <section id="menu" class="panel">
      <h1>Egg Arena</h1>
      <p>Survive the arena. Dodge enemies and collect the highest score.</p>
      <button id="start">Start Game</button>
      <div class="controls">Move: WASD or arrow keys · Aim &amp; shoot: mouse · Mobile: left pad &amp; shoot button</div>
    </section>
    <div class="mobile-controls"><div id="pad" class="pad"></div><div id="shoot" class="shoot"></div></div>
  </main>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W,H,dpr,running=false,last=0,score=0,best=Number(localStorage.getItem('egg-arena-best')||0),keys={},bullets=[],enemies=[],particles=[];
bestEl.textContent=best;
const player={x:0,y:0,r:18,speed:260,cooldown:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!running){player.x=W/2;player.y=H/2}}
addEventListener('resize',resize);resize();
function spawnEnemy(){const side=Math.floor(Math.random()*4),pad=30;let x,y;if(side<2){x=Math.random()*W;y=side?H+pad:-pad}else{x=side===2?-pad:W+pad;y=Math.random()*H}const hp=score>25&&Math.random()<.18?2:1,enemiesSpeed=75+Math.random()*55+Math.min(score*.6,80);enemies.push({x,y,r:15,hp,speed:enemiesSpeed,hit:0})}
function reset(){score=0;bullets=[];enemies=[];particles=[];player.x=W/2;player.y=H/2;player.cooldown=0;scoreEl.textContent='0';running=true;menu.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
document.getElementById('start').onclick=reset;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLower`q`);});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let mouse={x:W/2,y:H/2,down:false};canvas.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('pointerdown',e=>{mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('pointerup',()=>mouse.down=false);
function shoot(){if(player.cooldown>0)return;const dx=mouse.x-player.x,dy=mouse.y-player.y,d=Math.hypot(dx,dy)||1;bullets.push({x:player.x,y:player.y,vx:dx/d*520,vy:dy/d*520,r:5});player.cooldown=.14}
const pad=document.getElementById('pad'),shootBtn=document.getElementById('shoot');let stick={x:0,y:0};pad.addEventListener('pointermove',e=>{const b=pad.getBoundingRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,x=e.clientX-cx,y=e.clientY-cy,d=Math.hypot(x,y)||1,n=Math.min(d,40);stick.x=x/d*n/40;stick.y=y/d*n/40});pad.addEventListener('pointerup',()=>stick={x:0,y:0});shootBtn.addEventListener('pointerdown',()=>mouse.down=true);shootBtn.addEventListener('pointerup',()=>mouse.down=false);
function over(){running=false;if(score>best){best=score;localStorage.setItem('egg-arena-best',best);bestEl.textContent=best}menu.querySelector('h1').textContent='Game Over';menu.querySelector('p').textContent=`Score: ${score}`;document.getElementById('start').textContent='Play Again';menu.classList.remove('hidden')}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.033);last=now;player.cooldown-=dt;
let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+stick.x,my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+stick.y,d=Math.hypot(mx,my)||1;mx/=d;my/=d;player.x=Math.max(player.r,Math.min(W-player.r,player.x+mx*player.speed*dt));player.y=Math.max(player.r,Math.min(H-player.r,player.y+my*player.speed*dt));if(mouse.down)shoot();
if(!loop.spawnAt||now-loop.spawnAt>Math.max(280,850-score*12)){spawnEnemy();loop.spawnAt=now}for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)bullets.splice(i,1)}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(d<player.r+e.r){over();return}for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){bullets.splice(j,1);e.hp--;e.hit=.12;if(e.hp<=0){enemies.splice(i,1);score+=1;scoreEl.textContent=score;for(let p=0;p<8;p++)particles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*180,vy:(Math.random()-0.5)*180,life:1})}break}}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*2;if(p.life<=0)particles.splice(i,1)}draw();requestAnimationFrame(loop)}
function draw(){ctx.fillStyle='#081627';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(125,211,252,.09)';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const b of bullets){ctx.fillStyle='#ffdd57';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}for(const e of enemies){ctx.fillStyle=e.hit?'#fff':'#ef476f';ctx.beginPath();ctx.ellipse(e.x,e.y,e.r*.78,e.r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb3c1';ctx.beginPath();ctx.arc(e.x,e.y-3,e.r*.28,0,Math.PI*2);ctx.fill()}for(const p of particles){ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle='#ffd166';ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;ctx.fillStyle='#70d6ff';ctx.beginPath();ctx.ellipse(player.x,player.y,player.r*.78,player.r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x,player.y-5,5,0,Math.PI*2);ctx.fill()}
</script>
</body>
</html>
